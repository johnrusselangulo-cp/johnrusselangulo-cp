## Place this file at:
##   .github/workflows/snake.yml
## inside the WORK ACCOUNT profile repo: johnrusselangulo-cp/johnrusselangulo-cp
##
## Then enable "Read and write permissions" for Actions:
##   Repo → Settings → Actions → General → Workflow permissions

name: Generate Contribution Grid

on:
  schedule:
    - cron: "0 */24 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-contribution-grid.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid.svg?palette=github-dark
            dist/github-contribution-grid-dark.svg?palette=github-dark&color_snake=orange&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
